verion: '3.9'
services:
  web:
    build: .
    image: fiqifalah17/portofolio:1.0.2
    container_name: portofolio
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: uib-webbuilder-projects_app-net

